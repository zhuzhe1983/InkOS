[platformio]
default_envs = papers3

; M5Stack's PaperS3 PlatformIO recipe uses the generic S3 DevKitM board with
; 16 MiB flash and Octal PSRAM. M5Unified performs the PaperS3 board detection.
[env:papers3]
platform = espressif32 @ 7.0.1
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
lib_deps =
    m5stack/M5Unified @ 0.2.17
    m5stack/M5GFX @ 0.2.24
    bblanchon/ArduinoJson @ 7.4.3
    https://github.com/richgel999/miniz.git#3.1.2
build_flags =
    -I$PROJECT_DIR/include
    -DMINIZ_NO_DEFLATE_APIS
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DINKOS_PROFILE_ID=\"papers3\"
    -DINKOS_ORIENTATION=\"portrait\"
    -std=gnu++17
build_unflags =
    -std=gnu++11

; The navigation state machine is intentionally Arduino-free and is exercised
; on the host. Hardware adapters are covered by the papers3 cross-compile.
[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
build_flags =
    -std=c++17
